[platformio]
default_envs = sensor

; =========================================================
; CONFIGURACIÓN COMÚN
; =========================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7


; =========================================================
; ESP32 SENSOR
; =========================================================

[env:sensor]
board = esp32doit-devkit-v1

build_src_filter =
    -<*>
    +<esp32_sensor/>

build_flags =
    -I src/esp32_sensor
; Ajusta el puerto COM de tu placa (o deja estas lineas comentadas y PlatformIO lo detecta solo).
; upload_port = COM6
; monitor_port = COM6
monitor_speed = 115200

; =========================================================
; ESP32 ACTUADOR / LEDs
; =========================================================

[env:actuator]
board = esp32dev

build_src_filter =
    -<*>
    +<esp32_actuator/>

build_flags =
    -I src/esp32_actuator

; Ajusta el puerto COM de tu placa (o deja estas lineas comentadas y PlatformIO lo detecta solo).
; upload_port = COM6
; monitor_port = COM6
monitor_speed = 115200